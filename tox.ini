[tox]
envlist = py312, flake8

[testenv:flake8]
basepython=python
deps=flake8
commands=flake8 sharc

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/sharc
deps =
    -r{toxinidir}/requirements.txt
    pytest
commands =
    pytest --basetemp={envtmpdir} tests --ignore=tests/gui --ignore=tests/e2e
